<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Feedback Submission Fix</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .test-section {
            background: #16213e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #d63650;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        .info {
            color: #2196f3;
        }
        #output {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Feedback Submission Fix</h1>
    <p>This page tests the Firebase feedback submission error fix.</p>
    
    <div class="test-section">
        <h2>Test Firebase Demo Mode</h2>
        <button onclick="testFirebaseDemoMode()">Test Demo Mode Feedback</button>
        <button onclick="testLocalStorage()">Test Local Storage</button>
        <button onclick="checkDemoMode()">Check Demo Mode Status</button>
    </div>
    
    <div class="test-section">
        <h2>Console Output</h2>
        <div id="output"></div>
        <button onclick="clearOutput()">Clear Output</button>
    </div>

    <script type="module">
        import { CommunityTimings } from '/src/utils/communityTimings.jsx';
        import { isDemoMode, setFirebaseDemoMode } from '/src/utils/firebase.js';
        
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4caf50' : type === 'error' ? '#f44336' : '#2196f3';
            output.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }
        
        window.testFirebaseDemoMode = async () => {
            try {
                log('🧪 Testing Firebase demo mode feedback submission...', 'info');
                
                // Ensure demo mode is active
                setFirebaseDemoMode(true);
                log(`📱 Demo mode set: ${isDemoMode()}`, 'info');
                
                // Create test feedback
                const testFeedback = {
                    station: 'Joy Radio',
                    type: 'timing_accuracy',
                    rating: 'good',
                    comment: 'Test feedback - should not cause Firebase error',
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };
                
                log('📤 Submitting test feedback...', 'info');
                const result = await CommunityTimings.syncFeedbackToFirebase(testFeedback);
                
                log('✅ SUCCESS: Feedback submitted without errors!', 'success');
                log(`📄 Result: ${JSON.stringify(result, null, 2)}`, 'success');
                
            } catch (error) {
                log('❌ ERROR: Feedback submission failed!', 'error');
                log(`💥 Error details: ${error.message}`, 'error');
                log(`🔍 Stack: ${error.stack}`, 'error');
            }
        };
        
        window.testLocalStorage = () => {
            try {
                log('🧪 Testing local storage...', 'info');
                
                const testFeedback = {
                    station: 'Test Station',
                    type: 'test',
                    rating: 'good',
                    timestamp: new Date().toISOString()
                };
                
                CommunityTimings.storeFeedbackLocally(testFeedback, 'Test Station');
                log('✅ SUCCESS: Local storage works!', 'success');
                
            } catch (error) {
                log('❌ ERROR: Local storage failed!', 'error');
                log(`💥 Error: ${error.message}`, 'error');
            }
        };
        
        window.checkDemoMode = () => {
            log(`📊 Current demo mode status: ${isDemoMode()}`, 'info');
            log(`📦 Firebase available: ${typeof CommunityTimings !== 'undefined'}`, 'info');
        };
        
        window.clearOutput = () => {
            output.innerHTML = '';
        };
        
        // Auto-check status on load
        log('🚀 Test page loaded successfully!', 'success');
        checkDemoMode();
    </script>
</body>
</html>
