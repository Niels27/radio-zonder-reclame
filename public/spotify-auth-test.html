<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Auth Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #1db954;
        }
        .btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
        }
        .btn:hover {
            background: #1ed760;
        }
        .error {
            background: rgba(255, 0, 0, 0.2);
            border-left-color: #ff0000;
            color: #ff6b6b;
        }
        .success {
            background: rgba(0, 255, 0, 0.2);
            border-left-color: #00ff00;
            color: #51cf66;
        }
        .code-display {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            word-break: break-all;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <h1>🧪 Spotify Authentication Test</h1>
    
    <div class="test-section">
        <h3>Environment Information</h3>
        <div id="env-info"></div>
    </div>
    
    <div class="test-section">
        <h3>Test Authentication Flow</h3>
        <p>This will test the exact same authentication flow used by the main app:</p>
        <button class="btn" onclick="testSpotifyAuth()">🚀 Test Spotify Authentication</button>
        <button class="btn" onclick="openAuthWindow()">🔗 Open Auth in New Window</button>
        <div id="auth-results"></div>
    </div>
    
    <div class="test-section">
        <h3>Callback URL Test</h3>
        <p>Test if the callback URL is accessible:</p>
        <button class="btn" onclick="testCallbackUrl()">📞 Test Callback URL</button>
        <div id="callback-results"></div>
    </div>

    <script>
        // Spotify configuration - exact same as main app
        const SPOTIFY_CLIENT_ID = '67703322b3fe4c27aa42f10e3d067b84';
        const getRedirectUri = () => {
            return `${window.location.origin}/radio-zonder-reclame/callback.html`;
        };

        // Display environment information
        function displayEnvInfo() {
            const envInfo = document.getElementById('env-info');
            const redirectUri = getRedirectUri();
            
            envInfo.innerHTML = `
                <div class="code-display">
                    <strong>Origin:</strong> ${window.location.origin}<br>
                    <strong>Protocol:</strong> ${window.location.protocol}<br>
                    <strong>Hostname:</strong> ${window.location.hostname}<br>
                    <strong>Port:</strong> ${window.location.port || 'default'}<br>
                    <strong>Pathname:</strong> ${window.location.pathname}<br>
                    <strong>Redirect URI:</strong> ${redirectUri}<br>
                    <strong>Secure Context:</strong> ${window.isSecureContext ? '✅ Yes' : '❌ No'}
                </div>
            `;
        }

        // Generate PKCE code verifier and challenge
        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return btoa(String.fromCharCode.apply(null, array))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }

        function generateRandomString(length) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // Test Spotify authentication
        async function testSpotifyAuth() {
            const resultsDiv = document.getElementById('auth-results');
            resultsDiv.innerHTML = '<div class="code-display">🔄 Generating authentication URL...</div>';

            try {
                const state = generateRandomString(16);
                const codeVerifier = generateCodeVerifier();
                const codeChallenge = await generateCodeChallenge(codeVerifier);
                const redirectUri = getRedirectUri();

                const params = new URLSearchParams({
                    response_type: 'code',
                    client_id: SPOTIFY_CLIENT_ID,
                    scope: 'playlist-read-private playlist-read-collaborative streaming user-read-email user-read-private user-library-read user-read-playback-state user-modify-playback-state',
                    redirect_uri: redirectUri,
                    state: state,
                    code_challenge_method: 'S256',
                    code_challenge: codeChallenge,
                    show_dialog: 'true'
                });

                const authUrl = `https://accounts.spotify.com/authorize?${params.toString()}`;

                console.log('🔧 Test Auth Details:');
                console.log('  - Client ID:', SPOTIFY_CLIENT_ID);
                console.log('  - Redirect URI:', redirectUri);
                console.log('  - State:', state);
                console.log('  - Code Verifier:', codeVerifier);
                console.log('  - Code Challenge:', codeChallenge);
                console.log('  - Full Auth URL:', authUrl);

                resultsDiv.innerHTML = `
                    <div class="code-display">
                        <strong>✅ Authentication URL Generated Successfully!</strong><br><br>
                        <strong>Client ID:</strong> ${SPOTIFY_CLIENT_ID}<br>
                        <strong>Redirect URI:</strong> ${redirectUri}<br>
                        <strong>State:</strong> ${state}<br><br>
                        <a href="${authUrl}" target="_blank" style="color: #1db954; font-weight: bold; text-decoration: underline;">
                            🚀 CLICK HERE TO TEST SPOTIFY AUTHENTICATION
                        </a><br><br>
                        <small style="color: #888;">
                            This will redirect to Spotify's authorization page. 
                            If you get an "INVALID_CLIENT: Invalid redirect URI" error, 
                            the redirect URI needs to be added to your Spotify app configuration.
                        </small>
                    </div>
                `;

            } catch (error) {
                console.error('❌ Auth test error:', error);
                resultsDiv.innerHTML = `
                    <div class="test-section error">
                        <strong>❌ Error generating authentication URL:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        // Open auth in new window to capture any errors
        async function openAuthWindow() {
            try {
                const state = generateRandomString(16);
                const codeVerifier = generateCodeVerifier();
                const codeChallenge = await generateCodeChallenge(codeVerifier);
                const redirectUri = getRedirectUri();

                const params = new URLSearchParams({
                    response_type: 'code',
                    client_id: SPOTIFY_CLIENT_ID,
                    scope: 'playlist-read-private playlist-read-collaborative streaming user-read-email user-read-private user-library-read user-read-playback-state user-modify-playback-state',
                    redirect_uri: redirectUri,
                    state: state,
                    code_challenge_method: 'S256',
                    code_challenge: codeChallenge,
                    show_dialog: 'true'
                });

                const authUrl = `https://accounts.spotify.com/authorize?${params.toString()}`;
                
                // Store for validation
                localStorage.setItem('spotify_auth_state', state);
                localStorage.setItem('spotify_code_verifier', codeVerifier);

                // Open in new window
                const authWindow = window.open(authUrl, 'spotify-auth', 'width=500,height=700,scrollbars=yes,resizable=yes');
                
                // Listen for messages from callback
                window.addEventListener('message', (event) => {
                    console.log('🔧 Received message:', event.data);
                    
                    if (event.data.type === 'SPOTIFY_AUTH_SUCCESS') {
                        document.getElementById('auth-results').innerHTML = `
                            <div class="test-section success">
                                <strong>✅ Authentication Successful!</strong><br>
                                Authorization code received: ${event.data.code.substring(0, 20)}...<br>
                                State: ${event.data.state}
                            </div>
                        `;
                        authWindow.close();
                    } else if (event.data.type === 'SPOTIFY_AUTH_ERROR') {
                        document.getElementById('auth-results').innerHTML = `
                            <div class="test-section error">
                                <strong>❌ Authentication Failed!</strong><br>
                                Error: ${event.data.error}<br>
                                Description: ${event.data.errorDescription || 'No description provided'}
                            </div>
                        `;
                        authWindow.close();
                    }
                });

            } catch (error) {
                console.error('❌ Window auth error:', error);
                document.getElementById('auth-results').innerHTML = `
                    <div class="test-section error">
                        <strong>❌ Error opening auth window:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        // Test callback URL accessibility
        async function testCallbackUrl() {
            const resultsDiv = document.getElementById('callback-results');
            const callbackUrl = getRedirectUri();
            
            resultsDiv.innerHTML = '<div class="code-display">🔄 Testing callback URL...</div>';

            try {
                const response = await fetch(callbackUrl, { method: 'HEAD' });
                
                if (response.ok) {
                    resultsDiv.innerHTML = `
                        <div class="test-section success">
                            <strong>✅ Callback URL is accessible!</strong><br>
                            URL: <code>${callbackUrl}</code><br>
                            Status: ${response.status} ${response.statusText}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-section error">
                            <strong>❌ Callback URL returned an error:</strong><br>
                            URL: <code>${callbackUrl}</code><br>
                            Status: ${response.status} ${response.statusText}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-section error">
                        <strong>❌ Cannot reach callback URL:</strong><br>
                        URL: <code>${callbackUrl}</code><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            displayEnvInfo();
            console.log('🧪 Spotify Auth Test Tool Loaded');
            console.log('🔧 Redirect URI:', getRedirectUri());
        });
    </script>
</body>
</html>
