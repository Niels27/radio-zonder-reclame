<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Spotify Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border-left: 4px solid;
        }
        .success { border-color: #1db954; background: #0d4921; }
        .error { border-color: #e22134; background: #4d0d15; }
        .warning { border-color: #ff9f00; background: #4d3300; }
        .info { border-color: #1ed760; background: #0a3d1a; }
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #1aa34a; }
        .code {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🎵 Quick Spotify Authentication Test</h1>
    
    <div class="info">
        <h3>Environment Detection</h3>
        <div id="environment-info"></div>
    </div>

    <div class="info">
        <h3>Expected Configuration</h3>
        <p><strong>Redirect URI that should be added to Spotify Dashboard:</strong></p>
        <div class="code" id="redirect-uri"></div>
        <button onclick="copyRedirectUri()">📋 Copy Redirect URI</button>
    </div>

    <div class="warning">
        <h3>Quick Test</h3>
        <button onclick="testSpotifyAuth()">🧪 Test Spotify Authentication</button>
        <button onclick="openDashboard()">🔧 Open Spotify Dashboard</button>
    </div>

    <div id="test-results"></div>

    <script>
        const CLIENT_ID = '67703322b3fe4c27aa42f10e3d067b84';
        
        // Detect environment
        function detectEnvironment() {
            const currentUrl = window.location.href;
            const isProduction = currentUrl.includes('niels27.github.io');
            const isLocal = currentUrl.includes('127.0.0.1') || currentUrl.includes('localhost');
            
            const redirectUri = isProduction 
                ? `${window.location.origin}/radio-zonder-reclame/callback.html`
                : `${window.location.origin}/radio-zonder-reclame/callback.html`;

            document.getElementById('environment-info').innerHTML = `
                <div class="code">
                    <strong>Current URL:</strong> ${currentUrl}<br>
                    <strong>Environment:</strong> ${isProduction ? 'Production (GitHub Pages)' : isLocal ? 'Local Development' : 'Unknown'}<br>
                    <strong>Expected Redirect URI:</strong> ${redirectUri}
                </div>
            `;

            document.getElementById('redirect-uri').textContent = redirectUri;
            
            return { isProduction, isLocal, redirectUri, currentUrl };
        }

        function copyRedirectUri() {
            const env = detectEnvironment();
            navigator.clipboard.writeText(env.redirectUri).then(() => {
                showResult('success', '✅ Redirect URI copied to clipboard!');
            }).catch(() => {
                showResult('error', '❌ Failed to copy to clipboard');
            });
        }

        function testSpotifyAuth() {
            const env = detectEnvironment();
            
            showResult('info', '🔄 Testing Spotify authentication...');
            
            const scopes = [
                'user-read-private',
                'user-read-email',
                'playlist-read-private',
                'playlist-read-collaborative',
                'user-library-read'
            ].join(' ');

            const params = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: scopes,
                redirect_uri: env.redirectUri,
                state: 'quick-test-' + Date.now()
            });

            const authUrl = `https://accounts.spotify.com/authorize?${params.toString()}`;
            
            showResult('info', `🚀 Redirecting to Spotify for authentication...`);
            
            // Open in a new window to test
            const authWindow = window.open(authUrl, 'spotify-auth', 'width=600,height=700');
            
            // Check if the window was blocked
            if (!authWindow) {
                showResult('error', '❌ Popup blocked. Please allow popups and try again.');
                return;
            }

            // Monitor the auth window
            const checkWindow = setInterval(() => {
                try {
                    if (authWindow.closed) {
                        clearInterval(checkWindow);
                        showResult('warning', '⚠️ Authentication window closed. Check the main app for results.');
                    }
                } catch (e) {
                    // Cross-origin errors are expected
                }
            }, 1000);
        }

        function openDashboard() {
            window.open('https://developer.spotify.com/dashboard', '_blank');
        }

        function showResult(type, message) {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            
            // Auto-scroll to the latest result
            div.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            detectEnvironment();
            
            // Check for auth callback parameters
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            
            if (code) {
                showResult('success', '✅ Authentication successful! Authorization code received.');
            } else if (error) {
                showResult('error', `❌ Authentication failed: ${error} - ${urlParams.get('error_description') || 'Unknown error'}`);
            }
        });
    </script>
</body>
</html>
