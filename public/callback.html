<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Authorization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .success { color: #1db954; }
        .error { color: #e22134; }
        .loading { color: #1e90ff; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="loading">🔄 Processing authorization...</div>
    </div>
    <script>
        console.log('🔧 Callback page loaded');
        console.log('🔧 Current URL:', window.location.href);
        console.log('🔧 Origin:', window.location.origin);
        console.log('🔧 Protocol:', window.location.protocol);
        console.log('🔧 Is secure context:', window.isSecureContext);
        
        // Extract parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');
        
        console.log('🔧 Parsed params:', { 
            code: code ? `${code.substring(0, 10)}...` : null, 
            state: state ? `${state.substring(0, 10)}...` : null, 
            error, 
            errorDescription 
        });
        
        const statusEl = document.getElementById('status');
        
        if (error) {
            console.error('❌ Spotify auth error:', error, errorDescription);
            statusEl.textContent = `❌ Error: ${error} - ${errorDescription || 'Unknown error'}`;
            statusEl.className = 'error';
            
            // Send error to parent window
            if (window.opener) {
                try {
                    window.opener.postMessage({
                        type: 'SPOTIFY_AUTH_ERROR',
                        error: error,
                        errorDescription: errorDescription
                    }, window.location.origin);
                    console.log('✅ Error message sent to parent');
                } catch (e) {
                    console.error('❌ Failed to send error to parent:', e);
                }
            }
        } else if (code) {
            console.log('✅ Authorization successful, processing...');
            statusEl.textContent = '✅ Authorization successful! Processing...';
            statusEl.className = 'success';
            
            // Send success to parent window
            if (window.opener) {
                try {
                    window.opener.postMessage({
                        type: 'SPOTIFY_AUTH_SUCCESS',
                        code: code,
                        state: state
                    }, window.location.origin);
                    console.log('✅ Success message sent to parent');
                } catch (e) {
                    console.error('❌ Failed to send success to parent:', e);
                }
            } else {
                console.warn('⚠️ No parent window found');
            }
        } else {
            console.error('❌ No authorization code or error found in URL');
            statusEl.textContent = '❌ No authorization code or error found in URL';
            statusEl.className = 'error';
        }
        
        // Close popup after a short delay
        setTimeout(() => {
            console.log('🔄 Closing popup window...');
            window.close();
        }, 3000);
    </script>
</body>
</html>
