<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Test</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .button {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .button:hover {
            background: #2563eb;
        }
        .button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #059669; }
        .error { background: #dc2626; }
        .warning { background: #d97706; }
        .info { background: #3b82f6; }
        .log {
            background: #374151;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
        #youtube-player {
            border: 1px solid #6b7280;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>YouTube Playlist Test</h1>
        
        <div>
            <h3>Test Playlists:</h3>
            <button class="button" onclick="testPlaylist('PLrAOny6k3m_wjIfpvqYgIw4RNCmKlpDYj', 'Top 100 Songs 2024')">
                Test Playlist 1
            </button>
            <button class="button" onclick="testPlaylist('PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI', 'YouTube Hits Collection')">
                Test Playlist 2
            </button>
            <button class="button" onclick="testPlaylist('PLnP2jKmNOSeIuUtJ_eC8zKstJ3M4QLBtF', 'Best Pop Songs 2024')">
                Test Playlist 3
            </button>
            <button class="button" onclick="stopPlayer()">Stop Player</button>
            <button class="button" onclick="clearLog()">Clear Log</button>
        </div>
        
        <div id="status" class="status info">Ready to test</div>
        
        <div>
            <h3>Player Controls:</h3>
            <button class="button" onclick="playPlayer()">Play</button>
            <button class="button" onclick="pausePlayer()">Pause</button>
            <button class="button" onclick="setVolume(0.5)">50% Volume</button>
            <button class="button" onclick="setVolume(0.8)">80% Volume</button>
        </div>
        
        <div id="youtube-player"></div>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        let player = null;
        let apiLoaded = false;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            logDiv.textContent += logEntry;
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(message);
        }
        
        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function clearLog() {
            document.getElementById('log').textContent = '';
        }
        
        // Load YouTube API
        function loadYouTubeAPI() {
            return new Promise((resolve) => {
                if (window.YT && window.YT.Player) {
                    apiLoaded = true;
                    resolve();
                    return;
                }
                
                log('Loading YouTube API...');
                const script = document.createElement('script');
                script.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(script);
                
                window.onYouTubeIframeAPIReady = () => {
                    apiLoaded = true;
                    log('YouTube API loaded successfully');
                    resolve();
                };
            });
        }
        
        async function testPlaylist(playlistId, name) {
            try {
                setStatus(`Testing ${name}...`, 'info');
                log(`Starting test for: ${name} (${playlistId})`);
                
                if (!apiLoaded) {
                    await loadYouTubeAPI();
                }
                
                // Clean up existing player
                if (player) {
                    log('Destroying existing player...');
                    try {
                        player.destroy();
                    } catch (e) {
                        log(`Error destroying player: ${e.message}`);
                    }
                }
                
                // Remove existing div
                const existingDiv = document.getElementById('youtube-player');
                if (existingDiv) {
                    existingDiv.remove();
                }
                
                // Create new player div
                const playerDiv = document.createElement('div');
                playerDiv.id = 'youtube-player';
                document.querySelector('.test-container').appendChild(playerDiv);
                
                log('Creating YouTube player...');
                
                // Create player with timeout
                const createPlayer = () => {
                    return new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            reject(new Error('Player creation timeout'));
                        }, 15000);
                        
                        player = new YT.Player('youtube-player', {
                            height: '315',
                            width: '560',
                            playerVars: {
                                listType: 'playlist',
                                list: playlistId,
                                autoplay: 1,
                                controls: 1,
                                enablejsapi: 1,
                                origin: window.location.origin,
                                modestbranding: 1,
                                rel: 0,
                                cc_load_policy: 0,
                                hl: 'nl'
                            },
                            events: {
                                onReady: (event) => {
                                    clearTimeout(timeout);
                                    log('✅ Player ready');
                                    event.target.setVolume(70);
                                    setStatus(`${name} loaded successfully`, 'success');
                                    resolve(event.target);
                                },
                                onStateChange: (event) => {
                                    const states = {
                                        [-1]: 'UNSTARTED',
                                        [0]: 'ENDED', 
                                        [1]: 'PLAYING',
                                        [2]: 'PAUSED',
                                        [3]: 'BUFFERING',
                                        [5]: 'CUED'
                                    };
                                    log(`Player state: ${states[event.data] || event.data}`);
                                },
                                onError: (event) => {
                                    clearTimeout(timeout);
                                    const errorCodes = {
                                        2: 'Invalid playlist ID',
                                        5: 'HTML5 player error',
                                        100: 'Video not found',
                                        101: 'Owner restricts embedding',
                                        150: 'Embedding restricted'
                                    };
                                    const errorMsg = errorCodes[event.data] || `Unknown error (${event.data})`;
                                    log(`❌ Player error: ${errorMsg}`);
                                    setStatus(`Error: ${errorMsg}`, 'error');
                                    reject(new Error(errorMsg));
                                }
                            }
                        });
                    });
                };
                
                await createPlayer();
                
            } catch (error) {
                log(`❌ Test failed: ${error.message}`);
                setStatus(`Test failed: ${error.message}`, 'error');
            }
        }
        
        function playPlayer() {
            if (player && player.playVideo) {
                player.playVideo();
                log('Play command sent');
            } else {
                log('No player available');
            }
        }
        
        function pausePlayer() {
            if (player && player.pauseVideo) {
                player.pauseVideo();
                log('Pause command sent');
            } else {
                log('No player available');
            }
        }
        
        function setVolume(volume) {
            if (player && player.setVolume) {
                player.setVolume(Math.round(volume * 100));
                log(`Volume set to ${Math.round(volume * 100)}%`);
            } else {
                log('No player available');
            }
        }
        
        function stopPlayer() {
            if (player) {
                try {
                    player.stopVideo();
                    player.destroy();
                    log('Player stopped and destroyed');
                    setStatus('Player stopped', 'info');
                } catch (e) {
                    log(`Error stopping player: ${e.message}`);
                }
                player = null;
            }
        }
        
        // Initial load
        log('YouTube Playlist Test initialized');
        setStatus('Ready to test playlists', 'info');
    </script>
</body>
</html>
